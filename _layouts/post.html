<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="{{ page.description | default: page.title | escape }}">
  <title>{{ page.title | escape }} — Ravi Sheoran</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/blog/blog.css' | relative_url }}">
</head>
<body>
  <main class="blog-page post-page">
    <header>
      <a class="name" href="{{ '/' | relative_url }}">Ravi Sheoran<span>.</span></a>
      <a class="back-link" href="{{ '/blog/' | relative_url }}">← All posts</a>
    </header>
    <article class="post-content">
      <p class="eyebrow">WRITING &amp; NOTES</p>
      <h1>{{ page.title | escape }}</h1>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {{ content }}
    </article>
  </main>
</body>
</html>
